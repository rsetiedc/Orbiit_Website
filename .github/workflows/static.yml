name: Deploy ORBIIT Website

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # =========================================================
      # 1. CHECKOUT + CONFIGURE GITHUB PAGES
      # =========================================================
      - name: Checkout and Configure Pages
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # =========================================================
      # 2. VALIDATE WEBSITE
      # =========================================================
      - name: Validate Website
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       ORBIIT WEBSITE VALIDATION"
          echo "=========================================="

          # Check main files
          echo "Checking required files..."

          test -f index.html || {
            echo "ERROR: index.html is missing"
            exit 1
          }

          test -f styles.css || {
            echo "ERROR: styles.css is missing"
            exit 1
          }

          test -f script.js || {
            echo "ERROR: script.js is missing"
            exit 1
          }

          echo "✓ Required files found"

          # Check HTML files
          echo "Checking HTML files..."

          for file in $(find . -name "*.html" -not -path "./.git/*"); do
            if ! grep -qi "<html" "$file"; then
              echo "ERROR: Invalid HTML file: $file"
              exit 1
            fi

            echo "✓ $file"
          done

          # Check CSS
          echo "Checking CSS..."

          for file in $(find . -name "*.css" -not -path "./.git/*"); do
            test -s "$file" || {
              echo "ERROR: Empty CSS file: $file"
              exit 1
            }

            echo "✓ $file"
          done

          # Check JavaScript
          echo "Checking JavaScript..."

          for file in $(find . -name "*.js" -not -path "./.git/*"); do
            test -s "$file" || {
              echo "ERROR: Empty JavaScript file: $file"
              exit 1
            }

            echo "✓ $file"
          done

          # Check for obvious secrets
          echo "Running security check..."

          if grep -RniE \
            --exclude-dir=.git \
            --exclude="*.yml" \
            --exclude="*.yaml" \
            "BEGIN PRIVATE KEY|AWS_SECRET_ACCESS_KEY" \
            .; then

            echo "ERROR: Possible secret detected"
            exit 1
          fi

          echo "✓ Security check passed"

          echo "=========================================="
          echo "       VALIDATION SUCCESSFUL"
          echo "=========================================="


      # =========================================================
      # 3. PACKAGE WEBSITE
      # =========================================================
      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."


      # =========================================================
      # 4. DEPLOY TO GITHUB PAGES
      # =========================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Website:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "Commit:"
          echo "$GITHUB_SHA"
          echo ""
          echo "=========================================="
